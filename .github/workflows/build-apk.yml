name: Build TransCo APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Live site address, ending with / (e.g. https://yourdomain.com/transco/)"
        required: true
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK (installable)
        run: |
          URL="${{ github.event.inputs.site_url }}"
          if [ -n "$URL" ]; then gradle assembleDebug -PTRANSCO_URL="$URL"; else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: TransCo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
